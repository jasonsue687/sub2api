name: AsterFlow Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags: ['asterflow-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Formal tag, e.g. asterflow-v0.2.13-r1'
        required: true
        type: string
      build_run_id:
        description: 'Successful AsterFlow Build run; the image is reused without rebuilding'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: asterflow-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'jasonsue687/sub2api' && (github.event_name == 'push' || github.ref == 'refs/heads/asterflow')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: asterflow
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable release from verified build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 deploy/asterflow/promote.py
