name: AsterFlow Build

on:
  push:
    branches: [asterflow]
  pull_request:
    branches: [asterflow]
  workflow_dispatch:
    inputs:
      skip_checks:
        description: 'Use completed local validation and skip GitHub CI (explicit operator approval required)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: asterflow-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'jasonsue687/sub2api' && !(github.event_name == 'workflow_dispatch' && inputs.skip_checks)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Test deployment policy and failure recovery
        run: python3 -m unittest discover -s deploy/asterflow -p 'test_*.py'
      - name: Backend lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend
      - name: Backend unit tests
        run: make -C backend test-unit
      - name: Backend integration tests
        run: make -C backend test-integration
      - name: Audit race tests
        working-directory: backend
        run: go test -race ./internal/pkg/anthropicaudit
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Frontend lint, types and critical tests
        run: make test-frontend
      - name: Anthropic monitor tests
        run: >-
          pnpm --dir frontend exec vitest run
          src/views/admin/__tests__/AnthropicRequestsView.spec.ts
          src/views/admin/__tests__/AnthropicRequestDetailView.spec.ts
          src/views/admin/__tests__/AnthropicOutboundAuditView.spec.ts
          src/utils/__tests__/anthropicRequestDiff.spec.ts

  image:
    needs: verify
    if: >-
      always() && !cancelled() && github.repository == 'jasonsue687/sub2api' &&
      github.ref == 'refs/heads/asterflow' && github.event_name != 'pull_request' &&
      (needs.verify.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.skip_checks && needs.verify.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set release version
        id: version
        run: |
          base=$(cat backend/cmd/server/VERSION)
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=${base}-asterflow.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable release
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jasonsue687/sub2api:asterflow-sha-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jasonsue687/sub2api
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=asterflow-amd64
          cache-to: type=gha,mode=max,scope=asterflow-amd64
      - name: Write deployment manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: python3 deploy/asterflow/manifest.py
      - uses: actions/upload-artifact@v7
        with:
          name: asterflow-release
          path: release.json
          retention-days: 90
          overwrite: true
          if-no-files-found: error
      - name: Release summary
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Commit: `%s`\n\nImage: `ghcr.io/jasonsue687/sub2api@%s`\n\nDeploy build run ID: `%s`\n' "$GITHUB_SHA" "$DIGEST" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
